<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name | Portfolio</title>
  <meta name="description" content="Portfolio of Your Name">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#projects">Skip to projects</a>
  <div class="layout">
    <header class="side">
      <h1 id="name">Your Name</h1>
      <p id="tagline" class="tagline"></p>
      <nav aria-label="Sections">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#files">Files</a>
        <a href="#contact">Contact</a>
      </nav>
      <button id="theme" class="theme" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </header>

    <main>
      <section id="about">
        <h2>About</h2>
        <p id="about-text"></p>
      </section>

      <section id="projects">
        <h2>Projects</h2>
        <div id="filters" class="filters" role="group" aria-label="Filter projects by tag"></div>
        <ul id="project-list" class="projects"></ul>
      </section>

      <section id="files">
        <h2>Files</h2>
        <ul id="file-list" class="files"></ul>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <ul id="contact-list" class="contact"></ul>
      </section>

      <footer><span id="year"></span> <span id="footer-name"></span></footer>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
